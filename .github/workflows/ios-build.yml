name: Build Signed iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: bundle install

      - name: Check secrets are present
        run: |
          if [ -z "$GH_PAT" ]; then echo "GH_PAT missing"; exit 1; else echo "GH_PAT present"; fi
          if [ -z "$TEAMID" ]; then echo "TEAMID missing"; exit 1; else echo "TEAMID present"; fi
          if [ -z "$MATCH_PASSWORD" ]; then echo "MATCH_PASSWORD missing"; exit 1; else echo "MATCH_PASSWORD present"; fi
          if [ -z "$FASTLANE_KEY_ID" ]; then echo "FASTLANE_KEY_ID missing"; exit 1; else echo "FASTLANE_KEY_ID present"; fi
          if [ -z "$FASTLANE_ISSUER_ID" ]; then echo "FASTLANE_ISSUER_ID missing"; exit 1; else echo "FASTLANE_ISSUER_ID present"; fi
          if [ -z "$FASTLANE_KEY" ]; then echo "FASTLANE_KEY missing"; exit 1; else echo "FASTLANE_KEY present"; fi
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

      - name: Build signed IPA
        run: bundle exec fastlane build_bridge
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinxNightscoutBridge-IPA
          path: artifacts
